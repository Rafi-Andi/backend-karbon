# KarbonKita — production stack (pola CloudPanel reverse proxy)
#
# VPS sekolah pakai CloudPanel (Nginx host) yang sudah pegang 80/443.
# Karena itu container ini TIDAK pakai Caddy & TIDAK bind 80/443:
# - service `web` (nginx) hanya publish ke 127.0.0.1:${WEB_PORT} (localhost).
# - CloudPanel membuat "Reverse Proxy" domain -> http://127.0.0.1:${WEB_PORT},
#   dan CloudPanel yang urus HTTPS.
# - app/queue/db tetap internal, tanpa port host -> tidak mungkin tabrakan.
#
# Pemakaian:
#   docker compose -p karbonkita up -d --build
#   # lalu di CloudPanel: Site > Reverse Proxy -> http://127.0.0.1:8080

name: karbonkita

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: karbonkita-app:latest
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # File .env host di-mount agar perintah artisan tulis-file
      # (key:generate, dsb.) bisa jalan dari dalam container.
      - ./.env:/var/www/html/.env
      # Foto bukti/katalog persist di luar image (aman saat rebuild).
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
      # Hasil build Vite dibagikan ke nginx (file statis).
      - public_build:/var/www/html/public/build
      # public/storage symlink butuh folder publik ini konsisten dgn nginx.
      - ./public:/var/www/html/public
    networks:
      - internal

  queue:
    image: karbonkita-app:latest
    restart: unless-stopped
    command: ["queue"]
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    networks:
      - internal

  db:
    image: mysql:8.0
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-karbonkita}
      MYSQL_USER: ${DB_USERNAME:-karbonkita}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD wajib diisi di .env}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - internal

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # HANYA localhost VPS. CloudPanel (Nginx host) yang reverse-proxy ke sini.
    # Ganti WEB_PORT di .env bila 8080 sudah dipakai projek lain.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # public/ host + build hasil app (menimpa public/build).
      - ./public:/var/www/html/public:ro
      - public_build:/var/www/html/public/build:ro
      # File upload storage agar nginx bisa serve langsung (read-only).
      - storage_app:/var/www/html/storage/app:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - internal

volumes:
  dbdata:
  storage_app:
  storage_logs:
  public_build:

networks:
  # Jaringan privat per-projek (db & app hanya terlihat internal).
  internal:
    name: karbonkita_internal

# Nginx internal — melayani Laravel via PHP-FPM.
#
# Container ini TIDAK pegang 80/443. Ia listen di port 80 internal dan
# dipublish ke 127.0.0.1:${WEB_PORT} oleh compose. CloudPanel (Nginx host)
# yang melakukan reverse proxy + HTTPS dari domain ke port localhost itu.
#
# Root = path sama dengan container `app` (/var/www/html/public) via
# volume bersama `public_build`, sehingga static & fastcgi konsisten.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 12M;

    # --- Log ke stdout/stderr agar terlihat `docker compose logs web` ---
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # --- Laravel front controller ---
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- PHP-FPM di service `app` ---
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        # Health check bawaan Laravel: jangan cache.
        fastcgi_read_timeout 60s;
    }

    # --- Upload warga/mitra di storage/app/public lewat symlink public/storage ---
    # ($realpath_root akan mengikuti symlink ke folder storage yang di-mount)
    location /storage/ {
        try_files $uri /index.php?$query_string;
    }

    # --- Blokir file tersembunyi (kecuali ACME) ---
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # --- Cache aset build Vite (immutable, ada hash di nama file) ---
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Kompresi dasar ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}
